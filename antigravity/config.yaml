name: "Google Antigravity CLI"
slug: "antigravity"
description: "Google Antigravity AI coding assistant and remote-control daemon with web terminal Ingress"
version: "1.0.0"
url: "https://github.com/mostlyrobots/agy-ha"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-excited-outline"
panel_title: "Antigravity"
homeassistant_api: true
hassio_api: true
hassio_role: "manager"
docker_api: true
full_access: true
apparmor: false
map:
  - config:rw
  - share:rw
  - ssl:rw
  - media:rw
  - backup:rw
environment:
  SHELL: "/bin/bash"
  TERM: "xterm-256color"
options:
  default_model: "Gemini 3.8 Flash (Low)"
  gcp_project: ""
  auto_start_remote_control: true
schema:
  default_model: "str?"
  gcp_project: "str?"
  auto_start_remote_control: "bool?"
