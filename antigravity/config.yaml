name: "Google Antigravity CLI"
slug: "antigravity"
description: "Google Antigravity AI coding assistant and remote-control daemon with persistent Ingress TUI"
version: "1.1.0"
url: "https://github.com/mostlyrobots/agy-ha"
image: "ghcr.io/mostlyrobots/{arch}-addon-antigravity"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-excited-outline"
panel_title: "Antigravity"
homeassistant_api: true
hassio_api: true
hassio_role: "manager"
docker_api: true
full_access: true
apparmor: false
map:
  - homeassistant_config:rw
  - addon_configs:rw
  - share:rw
  - ssl:rw
  - media:rw
  - backup:rw
environment:
  SHELL: "/bin/bash"
  TERM: "xterm-256color"
  COLORTERM: "truecolor"
options:
  instance_name: "homeassistant"
  auto_start_remote_control: true
  git_user_name: ""
  git_user_email: ""
schema:
  instance_name: "str?"
  auto_start_remote_control: "bool?"
  git_user_name: "str?"
  git_user_email: "str?"
